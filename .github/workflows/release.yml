name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create or publish release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify-release:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please]
    uses: ./.github/workflows/verify.yml
    with:
      release_sha: ${{ needs.release-please.outputs.release_sha }}

  deploy:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, verify-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - name: Install LiveKit CLI
        run: |
          set -euo pipefail
          LIVEKIT_CLI_VERSION=2.16.0
          LIVEKIT_CLI_SHA256=64597a9b14671047d78539ca892b8cd5dcde38bf3b2604c6e5bdba8ca2386923
          install_dir="$RUNNER_TEMP/livekit/bin"
          archive="$RUNNER_TEMP/livekit-cli.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/livekit/livekit-cli/releases/download/v${LIVEKIT_CLI_VERSION}/lk_${LIVEKIT_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$LIVEKIT_CLI_SHA256  $archive" | sha256sum --check
          tar xzf "$archive" -C "$install_dir" --wildcards --no-anchored lk
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Deploy to LiveKit Cloud
        env:
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        run: |
          set -euo pipefail

          agent_id="$(awk -F '"' '/^[[:space:]]*id =/ { print $2; exit }' livekit.toml)"
          if [[ -z "$agent_id" ]]; then
            echo "livekit.toml does not contain an agent ID." >&2
            exit 1
          fi

          read_agent_state() {
            local output
            if ! output="$(lk agent status)"; then
              return 1
            fi
            printf '%s\n' "$output" >&2
            printf '%s\n' "$output" | awk -F '│' -v id="$agent_id" '
              NF >= 6 && index($2, id) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $5)
                print $3 "\t" $5
                exit
              }
            '
          }

          if ! agent_state="$(read_agent_state)"; then
            echo "Could not read the current LiveKit agent status." >&2
            exit 1
          fi
          IFS=$'\t' read -r previous_version _ <<< "$agent_state"
          if [[ -z "$previous_version" ]]; then
            echo "Could not read the current LiveKit agent version." >&2
            exit 1
          fi

          lk agent deploy --yes

          for attempt in {1..30}; do
            if agent_state="$(read_agent_state)"; then
              IFS=$'\t' read -r deployed_version status <<< "$agent_state"
              case "$status" in
                Running|Sleeping)
                  if [[ "$deployed_version" != "$previous_version" ]]; then
                    echo "LiveKit agent version $deployed_version is $status."
                    exit 0
                  fi
                  ;;
                Error|CrashLoop|Disabled|"Build Failed"|"Server Error"|Deleted|Suspended)
                  if [[ "$deployed_version" != "$previous_version" ]]; then
                    echo "New LiveKit agent version entered terminal status: $status" >&2
                    exit 1
                  fi
                  ;;
              esac
            fi

            echo "Waiting for the new LiveKit agent version to become healthy ($attempt/30)."
            sleep 10
          done

          echo "Timed out waiting for the new LiveKit agent version to become healthy." >&2
          exit 1
