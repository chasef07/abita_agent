name: Deploy to LiveKit Cloud

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

  deploy:
    name: Deploy Agent
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install LiveKit CLI
        run: |
          LIVEKIT_CLI_VERSION=2.16.0
          mkdir -p "$HOME/.livekit/bin"
          curl -sSL "https://github.com/livekit/livekit-cli/releases/download/v${LIVEKIT_CLI_VERSION}/lk_${LIVEKIT_CLI_VERSION}_linux_amd64.tar.gz" \
            | tar xzf - -C "$HOME/.livekit/bin" --wildcards --no-anchored lk
          echo "$HOME/.livekit/bin" >> $GITHUB_PATH

      - name: Deploy to LiveKit Cloud
        env:
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
        run: lk agent deploy --yes
